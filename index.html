<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Startseite für Schlüsselanhänger, ACRISS-Check, ACRISS-Liste und Führerschein-Check.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="manifest" href="./site.webmanifest">
  <meta name="theme-color" content="#f4f4f4">
  <title>Tools</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Theme vor dem ersten Rendern setzen, sonst blitzt der Hellmodus auf -->
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  </script>
  <script src="./theme.js" defer></script>
</head>

<body>
  <div class="page-wrapper">
    <div class="app-container">
      <div class="header">
        <img src="./favicon.svg" alt="Logo" class="logo">
        <h1 class="title">Tools</h1>
        <p class="subtitle">Helferlein für den Schalter</p>
      </div>

      <div class="form-card">
        <div class="tiles">
          <a class="tile" href="./schluesselanhaenger/">
            <img class="tile-logo" src="./assets/schluesselanhaenger.webp" alt="">
            <span class="tile-title">Schlüsselanhänger</span>
            <span class="tile-hint">Anhänger-Generator &amp; PDF-Export</span>
          </a>
          <a class="tile" href="./acriss-check/">
            <img class="tile-logo" src="./assets/acriss.svg" alt="">
            <span class="tile-title">ACRISS-Check</span>
            <span class="tile-hint">Vermietrichtlinien je Fahrzeuggruppe</span>
          </a>
          <a class="tile" href="./acriss-liste/">
            <img class="tile-logo" src="./assets/acriss.svg" alt="">
            <span class="tile-title">ACRISS-Liste</span>
            <span class="tile-hint">Alle Fahrzeuggruppen auf einen Blick</span>
          </a>
          <a class="tile" href="./fuehrerschein-check/">
            <img class="tile-logo" src="./assets/fuehrerschein.svg" alt="">
            <span class="tile-title">Führerschein-Check</span>
            <span class="tile-hint">Bis wann muss ich meinen Führerschein umtauschen?</span>
          </a>
        </div>
      </div>

      <footer class="footer">
        <button class="theme-toggle" type="button" title="Hell-/Dunkelmodus umschalten">
          <span class="theme-icon" aria-hidden="true">
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </span>
        </button>
      </footer>
    </div>
  </div>
</body>

</html>
